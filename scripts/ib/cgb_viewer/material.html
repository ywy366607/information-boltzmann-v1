<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CGB · 空间材料生长</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101822;color:#e7edf2;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:26px}h1{font-size:25px;margin:0 0 7px}p{color:#aebdca;margin:5px 0 18px}a{color:#91d8da}header{display:flex;justify-content:space-between;gap:15px;align-items:center}section{background:#172330;border:1px solid #304151;border-radius:12px;padding:18px;margin-top:18px}.controls{display:flex;gap:18px;align-items:center;flex-wrap:wrap}select,button{font:inherit;background:#233748;color:#fff;border:1px solid #4a6173;border-radius:7px;padding:6px 12px}input{accent-color:#6ec8c8}#time{flex:1;min-width:200px}#view{width:100%;height:540px;display:block;touch-action:none;cursor:grab}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.number{font-size:24px;font-variant-numeric:tabular-nums;color:#bce4db}.label{font-size:13px;color:#aebdca}.note{font-size:13px;color:#b4c3d0}.pill{font-size:12px;color:#9bd5cb;border:1px solid #47766e;border-radius:30px;padding:3px 10px}#curve{width:100%;height:120px;display:block}footer{margin:18px 0;color:#99aebd;font-size:13px}@media(max-width:700px){main{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}#view{height:400px}header{align-items:flex-start}}
</style>
<main>
<header><div><h1>空间材料生长</h1><span class="pill">实际状态回放 · 256 参考毫秒</span></div><a href="/">历史出生候选 →</a></header>
<p>同一局部沉积、拆解、扩散与有限储能过程。没有指定目标树形或分叉数。这是空间材料场，细胞谱系与神经突形态尚待形成。</p>
<section class="controls"><label>对照 <select id="arm"></select></label><label>显示密度 ≥ <input id="cut" type="range" min="0" max="0.65" step="0.01" value="0.30"> <span id="cutValue">0.30</span></label><label><input id="traceColor" type="checkbox"> 按活动痕迹着色</label></section>
<section><canvas id="view"></canvas><div class="controls"><button id="play">播放</button><input id="time" aria-label="回放时间" type="range" min="0" max="16" value="0"><span id="clock">0 ms</span></div><div class="note">拖动旋转。密度滑块只改变显示，全部材料与连接始终参与动力学；线条表示网格连接内的材料体积分数，不是轴突。</div></section>
<section><div class="stats"><div><div class="number" id="installed">—</div><div class="label">已安装材料</div></div><div><div class="number" id="material">—</div><div class="label">游离底物</div></div><div><div class="number" id="work">—</div><div class="label">累计源功</div></div><div><div class="number" id="visible">—</div><div class="label">当前显示连接 / 全部位置</div></div></div><canvas id="curve"></canvas><div class="note">绿色：已安装材料；蓝色：游离底物。两者使用同一个有限材料账。源功单列，不等同于语言信息量。</div></section>
<footer id="source">读取实际状态…</footer>
</main>
<script>
let scene,arm,yaw=-.6,pitch=.45,playing=false,last=0;
const $=id=>document.getElementById(id),canvas=$('view'),ctx=canvas.getContext('2d');
function resize(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);return[r.width,r.height,d]}
function project(v,w,h){let x=v[0]-4,y=v[1]-4,z=v[2]-4;let a=x*Math.cos(yaw)-z*Math.sin(yaw),b=x*Math.sin(yaw)+z*Math.cos(yaw);let yy=y*Math.cos(pitch)-b*Math.sin(pitch),zz=y*Math.sin(pitch)+b*Math.cos(pitch);let scale=Math.min(w,h)*.075*14/(14+zz);return[w/2+a*scale,h/2+yy*scale,zz]}
function draw(){if(!scene)return;const[w,h,d]=resize(canvas);ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#172330';ctx.fillRect(0,0,w,h);const frame=arm.frames[+$('time').value],cut=+$('cut').value;const points=scene.coordinates.map(v=>project(v,w,h));let segments=[];
for(let e=0;e<scene.pre.length;e++){let n=frame.density[e];if(n<cut)continue;let a=points[scene.pre[e]],b=points[scene.post[e]];segments.push({a,b,n,t:frame.trace[e],depth:(a[2]+b[2])/2})}segments.sort((a,b)=>b.depth-a.depth);
for(const s of segments){const t=$('traceColor').checked?Math.min(1,s.t*8):s.n;ctx.strokeStyle=`hsla(${185-65*t},65%,${52+15*t}%,${.35+.6*s.n})`;ctx.lineWidth=.6+3*s.n;ctx.beginPath();ctx.moveTo(s.a[0],s.a[1]);ctx.lineTo(s.b[0],s.b[1]);ctx.stroke()}
ctx.fillStyle='#a8bbca';ctx.font='13px system-ui';ctx.fillText('9 × 9 × 9 等体积空间网格',16,24);ctx.fillText('显示阈值不是生长规则',16,h-17);
$('clock').textContent=frame.ms+' ms';$('installed').textContent=frame.installed.toFixed(2);$('material').textContent=frame.material.toFixed(2);$('work').textContent=frame.source_work.toFixed(2);$('visible').textContent=segments.length+' / '+scene.pre.length;$('cutValue').textContent=cut.toFixed(2);drawCurve()}
function drawCurve(){const c=$('curve'),[w,h,d]=resize(c),g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);const max=arm.frames[0].installed+arm.frames[0].material;for(const [key,color]of[['installed','#83d2b6'],['material','#8bbde0']]){g.strokeStyle=color;g.lineWidth=2;g.beginPath();arm.frames.forEach((f,i)=>{let x=8+i/(arm.frames.length-1)*(w-16),y=h-10-f[key]/max*(h-20);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()}let x=8+(+$('time').value)/(arm.frames.length-1)*(w-16);g.strokeStyle='#60788c';g.beginPath();g.moveTo(x,5);g.lineTo(x,h-5);g.stroke()}
$('arm').onchange=()=>{arm=scene.arms.find(a=>a.id===$('arm').value);$('time').max=arm.frames.length-1;draw()};for(const id of['time','cut','traceColor'])$(id).oninput=draw;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';if(playing&&+$('time').value===arm.frames.length-1)$('time').value=0};
function animate(t){if(playing&&t-last>180){let i=+$('time').value;if(i>=arm.frames.length-1){playing=false;$('play').textContent='播放'}else{$('time').value=i+1;draw()}last=t}requestAnimationFrame(animate)}requestAnimationFrame(animate);
let drag;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,yaw,pitch];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw=drag[2]+(e.clientX-drag[0])*.008;pitch=Math.max(-1.4,Math.min(1.4,drag[3]+(e.clientY-drag[1])*.008));draw()};canvas.onpointerup=()=>drag=null;window.onresize=draw;
fetch('/material_scene.json').then(r=>{if(!r.ok)throw Error('尚未载入空间材料记录');return r.json()}).then(s=>{scene=s;for(const a of s.arms){let o=document.createElement('option');o.value=a.id;o.textContent=a.label;$('arm').appendChild(o)}$('arm').value=s.default;arm=s.arms.find(a=>a.id===s.default);$('time').max=arm.frames.length-1;$('source').textContent='已保存实测：四个材料参数对照，729 个空间单元、1944 个可沉积位置。原始状态、源功与完整恢复记录均随实验保存。';draw()}).catch(e=>$('source').textContent=e.message);
</script></html>
