<!doctype html><meta charset="utf-8"><title>Information Boltzmann</title>
<style>body{background:#101722;color:#e1e8ef;font:15px system-ui;margin:24px}h1{font-size:24px}#charts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}section{background:#1b2533;padding:12px;border-radius:10px}canvas{width:100%;height:180px}#phase{height:300px}small{color:#9cb1c6}button{padding:8px}</style>
<h1>Information Boltzmann · 流监控</h1><p id="status">连接中</p><button onclick="paused=!paused">暂停／恢复显示</button>
<p><small>动画是限频采样；曲线来自已记录事件。浏览器暂停不暂停模型。采样标量日志见本运行 tensorboard 目录。</small></p>
<section><h3>二维位置分布</h3><canvas id="phase" width="900" height="300"></canvas></section><div id="charts"></div>
<script>
let paused=false;let fields=['ce','mean_nll','energy','var_x','var_v','gamma'];
for(let key of fields)document.querySelector('#charts').insertAdjacentHTML('beforeend',`<section><h3>${key}</h3><canvas id="${key}" width="400" height="180"></canvas><small id="${key}value"></small></section>`);
function line(key,h){let c=document.getElementById(key),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);let a=h.filter(v=>Number.isFinite(v[key]));if(!a.length)return;let lo=Math.min(...a.map(v=>v[key])),hi=Math.max(...a.map(v=>v[key]));g.strokeStyle='#61d4ba';g.beginPath();a.forEach((v,i)=>{let x=8+(c.width-16)*(v.event-a[0].event)/Math.max(1,a.at(-1).event-a[0].event),y=165-145*(v[key]-lo)/Math.max(1e-12,hi-lo);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();document.getElementById(key+'value').textContent=`最新 ${a.at(-1)[key].toPrecision(5)} · 范围 ${lo.toPrecision(3)} — ${hi.toPrecision(3)}`}
async function tick(){if(paused)return;try{let data=await(await fetch('/api/state')).json(),f=data.current;document.getElementById('status').textContent=`${f.status} · 事件 ${f.event} · 已接受碰撞 ${f.accepted_collisions??0}`;fields.forEach(k=>line(k,data.history));let c=document.getElementById('phase'),g=c.getContext('2d'),p=f.particles.x;g.clearRect(0,0,c.width,c.height);let r=Math.max(.1,...p.flat().map(Math.abs));g.fillStyle='#61d4ba';for(let z of p){g.beginPath();g.arc(450+130*z[0]/r,150-130*z[1]/r,3,0,7);g.fill()}}catch(e){document.getElementById('status').textContent='等待监控数据'}}setInterval(tick,500);
</script>
